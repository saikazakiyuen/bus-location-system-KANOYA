<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大隅半島バスロケーションシステム</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    
    #ui-panel {
      position: absolute; bottom: 40px; left: 10px; z-index: 99;
      background: rgba(255, 255, 255, 0.9); padding: 15px; border: 2px solid black;
      border-radius: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    
    #time-display { font-size: 18px; font-weight: bold; }
    
    #settings-header {
      cursor: pointer; font-weight: bold; display: flex; justify-content: space-between;
      align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #ccc;
    }
    #settings-content { display: none; margin-top: 10px; }
    .route-toggle { font-size: 16px; margin-top: 10px; display: block; cursor: pointer; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="ui-panel">
    <div id="time-display">時刻: --:--:--</div>
    <div id="settings-header" onclick="toggleSettings()">
      <span>⚙️ 表示設定</span>
      <span id="toggle-icon">▼</span>
    </div>
    <div id="settings-content">
      <label class="route-toggle"><input type="checkbox" id="chk-route-101" checked> 系統101 (垂水〜鹿屋〜志布志)</label>
    </div>
  </div>
  
  <div id="map"></div>

  <script>
    const routesToLoad = ["101"]; 
    const systemData = {}; 
    let map;

    function toggleSettings() {
      const content = document.getElementById("settings-content");
      const icon = document.getElementById("toggle-icon");
      if (content.style.display === "block") {
        content.style.display = "none";
        icon.innerText = "▼";
      } else {
        content.style.display = "block";
        icon.innerText = "▲";
      }
    }

    async function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 31.428793, lng: 130.754004 },
        zoom: 11,
        disableDefaultUI: true, 
        zoomControl: true       
      });

      for (const routeId of routesToLoad) {
        await loadRouteData(routeId);
      }
      setInterval(updateSystem, 1000);
    }

    async function loadRouteData(routeId) {
      // ★改善点1: 各停留所が、路線全体の中で「何番目の座標か」を記録する方式に変更
      systemData[routeId] = { stops: {}, stopIndices: {}, allPathCoords: [], trips: [], polyline: null };

      const resRoute = await fetch(`route_${routeId}.csv`);
      const routeText = await resRoute.text();
      const routeRows = Papa.parse(routeText, { header: true, skipEmptyLines: true, transform: function(v){return v.trim();} }).data;

      routeRows.forEach(row => {
        const pos = { lat: parseFloat(row.lat), lng: parseFloat(row.lng) };
        systemData[routeId].allPathCoords.push(pos);

        if (row.type === 'stop') {
          systemData[routeId].stops[row.id] = pos;
          // 配列（全体の座標リスト）の最後尾のインデックスを記憶
          systemData[routeId].stopIndices[row.id] = systemData[routeId].allPathCoords.length - 1;
          new google.maps.Marker({ position: pos, map: map, label: "停", title: row.id });
        }
      });

      systemData[routeId].polyline = new google.maps.Polyline({
        path: systemData[routeId].allPathCoords, geodesic: true, strokeColor: "#00AAFF", strokeOpacity: 0.5, strokeWeight: 4, map: map
      });

      const resTime = await fetch(`timetable_${routeId}.csv`);
      const timeText = await resTime.text();
      const timeRows = Papa.parse(timeText, { header: true, skipEmptyLines: true, transform: function(v){return v.trim();} }).data;

      const schedulesByTrip = {};
      timeRows.forEach(row => {
        if (!schedulesByTrip[row.trip_id]) schedulesByTrip[row.trip_id] = [];
        schedulesByTrip[row.trip_id].push({ stop_id: row.stop_id, time: row.time });
      });

      for (const tripId in schedulesByTrip) {
        const marker = new google.maps.Marker({
          map: map,
          icon: { url: "bus.png", scaledSize: new google.maps.Size(64, 64), anchor: new google.maps.Point(32, 32) },
          visible: false
        });

        const infoWindow = new google.maps.InfoWindow({
          content: `<div style="padding: 5px; font-size: 16px; font-weight: bold; text-align: center;">便名: ${tripId}</div>`
        });
        marker.addListener("click", () => infoWindow.open(map, marker));

        systemData[routeId].trips.push({ tripId: tripId, schedule: schedulesByTrip[tripId], marker: marker });
      }
    }

    function timeToSeconds(timeStr) {
      const parts = timeStr.split(":");
      return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
    }

    function getPointAlongPath(path, fraction) {
      let total = 0, dists = [];
      for (let i = 0; i < path.length - 1; i++) {
        const d = google.maps.geometry.spherical.computeDistanceBetween(path[i], path[i+1]);
        dists.push(d); total += d;
      }
      const target = total * fraction;
      let curr = 0;
      for (let i = 0; i < path.length - 1; i++) {
        if (curr + dists[i] >= target) {
          return google.maps.geometry.spherical.interpolate(path[i], path[i+1], (target - curr) / dists[i]);
        }
        curr += dists[i];
      }
      return path[path.length - 1];
    }

    function updateSystem() {
      const now = new Date();
      document.getElementById("time-display").innerText = "時刻: " + now.toLocaleTimeString();
      const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

      for (const routeId of routesToLoad) {
        const isVisible = document.getElementById(`chk-route-${routeId}`).checked;
        const data = systemData[routeId];
        
        data.polyline.setVisible(isVisible);

        data.trips.forEach(trip => {
          if (!isVisible) { trip.marker.setVisible(false); return; }

          const sch = trip.schedule;
          const firstTime = timeToSeconds(sch[0].time);
          const lastTime = timeToSeconds(sch[sch.length - 1].time);

          if (currentSeconds < firstTime - 300 || currentSeconds > lastTime + 180) {
            trip.marker.setVisible(false); return;
          }
          trip.marker.setVisible(true);

          if (currentSeconds <= firstTime) { trip.marker.setPosition(data.stops[sch[0].stop_id]); return; }
          if (currentSeconds >= lastTime) { trip.marker.setPosition(data.stops[sch[sch.length - 1].stop_id]); return; }

          for (let i = 0; i < sch.length - 1; i++) {
            const timeA = timeToSeconds(sch[i].time);
            const timeB = timeToSeconds(sch[i+1].time);

            if (currentSeconds >= timeA && currentSeconds <= timeB) {
              const fraction = (currentSeconds - timeA) / (timeB - timeA);
              
              // ★改善点2: 区間（A地点〜B地点）のインデックスを取得して切り出す
              const idxA = data.stopIndices[sch[i].stop_id];
              const idxB = data.stopIndices[sch[i+1].stop_id];
              
              let segmentPath = [];
              if (idxA !== undefined && idxB !== undefined) {
                if (idxA < idxB) {
                  // 往路（正方向）の場合：AからBまでの全座標を切り出す
                  segmentPath = data.allPathCoords.slice(idxA, idxB + 1);
                } else {
                  // 復路（逆方向）の場合：BからAまでを切り出して逆順にする（今後の拡張対応）
                  segmentPath = data.allPathCoords.slice(idxB, idxA + 1).reverse();
                }
              } else {
                segmentPath = [data.stops[sch[i].stop_id], data.stops[sch[i+1].stop_id]];
              }

              const pathLatLng = segmentPath.map(p => new google.maps.LatLng(p.lat, p.lng));
              trip.marker.setPosition(getPointAlongPath(pathLatLng, fraction));
              break;
            }
          }
        });
      }
    }
  </script>
  
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBqcUNb7-_olnNZKHR_UyfqB5Zi2KOI5X8&libraries=geometry&callback=initMap"></script>
</body>
</html>
